name: Release Pipeline

on:
  push:
    branches: [main]

jobs:
  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: System-monitor-application

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # Create the Git tag BEFORE uploading the release
      - name: Create Git tag
        run: |
          git tag v${{ github.run_number }}
          git push origin v${{ github.run_number }}
        working-directory: ${{ github.workspace }}   # repo root, not subfolder

      - name: Build Electron app
        run: npm run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the built artifacts to the release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "System Health Monitor v${{ github.run_number }}"
          files: |
            System-monitor-application/release/*.exe
            System-monitor-application/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}