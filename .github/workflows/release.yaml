name: Release Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python / FastAPI ──────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: fastapi
        run: pip install pyinstaller fastapi uvicorn joblib scikit-learn pandas pydantic numpy

      - name: Build FastAPI with PyInstaller
        working-directory: fastapi
        run: pyinstaller --onefile --add-data "models;models" main_api.py --name ml-service

      # ── Copy ml-service.exe into Electron ─────────
      - name: Copy ML service to Electron resources
        run: |
          mkdir -p System-monitor-application/resources
          cp fastapi/dist/ml-service.exe System-monitor-application/resources/ml-service.exe
        shell: bash

      # ── Node / Electron ───────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: System-monitor-application
        run: npm install

      - name: Build app
        working-directory: System-monitor-application
        run: npm run build

      - name: Build and Publish Electron
        working-directory: System-monitor-application
        run: npm run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        working-directory: System-monitor-application
        run: dir release
        shell: cmd

      - name: Upload installer
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "System Health Monitor v${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            System-monitor-application/release/*.exe
            System-monitor-application/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}